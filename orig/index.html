<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Unsergram">
<meta name="robots" content="noindex, nofollow">
<title>Unsergram</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png?v=4">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#ffffff; --fg:#262626; --muted:#8e8e8e; --line:#dbdbdb; --soft:#f2f2f2;
  --sheet:#ffffff; --accent:#0095f6; --like:#ed4956; --seen:#c7c7c7;
  --r1:#ff7a59; --r2:#ffc15e; --r3:#e8457c; --danger:#ed4956;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --fg:#f5f5f5; --muted:#a8a8a8; --line:#262626; --soft:#1a1a1a;
    --sheet:#1c1c1c; --seen:#4a4a4a;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#f5f5f5; --muted:#a8a8a8; --line:#262626; --soft:#1a1a1a;
  --sheet:#1c1c1c; --seen:#4a4a4a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.38 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit}
#app{max-width:470px;margin:0 auto;min-height:100dvh;
  padding-bottom:calc(52px + env(safe-area-inset-bottom));position:relative}
.muted{color:var(--muted)}
.fine{font-size:12px;color:var(--muted)}

/* Kopfzeile */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;
  justify-content:space-between;gap:8px;padding:env(safe-area-inset-top) 10px 0 16px;
  height:calc(48px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.wordmark{font-family:'Grand Hotel',cursive;font-size:30px;font-weight:400;line-height:1;white-space:nowrap}
.topbar h1{font-size:17px;margin:0;font-weight:700}
.icon-btn{background:none;border:0;padding:7px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:25px;height:25px}

/* Avatare */
.av{border-radius:50%;overflow:hidden;background:var(--soft);display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;line-height:1;user-select:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* Story-Leiste */
.stories{display:flex;gap:14px;overflow-x:auto;padding:10px 12px 8px;border-bottom:1px solid var(--line);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 auto;width:70px;text-align:center;background:none;border:0;padding:0;cursor:pointer}
.ring{width:70px;height:70px;border-radius:50%;padding:2.5px;position:relative;
  background:conic-gradient(from 200deg,var(--r1),var(--r2),var(--r3),var(--r1))}
.ring.seen{background:var(--seen);padding:1.5px}
.ring.none{background:transparent;padding:2.5px}
.ring .av{width:100%;height:100%;border:3px solid var(--bg)}
.story small{display:block;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plus{position:absolute;right:1px;bottom:1px;width:22px;height:22px;border-radius:50%;background:var(--accent);
  color:#fff;border:2.5px solid var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}

/* Beiträge */
.post{border-bottom:1px solid var(--line);padding-bottom:8px}
.ph{display:flex;align-items:center;gap:9px;padding:9px 6px 9px 12px}
.ph b{cursor:pointer}
.ph .who{background:none;border:0;padding:0;cursor:pointer;display:flex}
.ph .more{margin-left:auto}
.media{position:relative;width:100%;background:var(--soft);overflow:hidden;cursor:pointer;user-select:none}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.textpost{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:28px;color:#fff;text-align:center}
.textpost p{margin:0;font-size:24px;font-weight:600;line-height:1.3;text-shadow:0 1px 8px rgba(0,0,0,.18);
  overflow-wrap:anywhere;white-space:pre-wrap}
.bigheart{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;color:#fff;
  opacity:0;transform:scale(0);pointer-events:none;filter:drop-shadow(0 4px 14px rgba(0,0,0,.3))}
.bigheart svg{width:100%;height:100%}
.bigheart.pop{animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(0)}15%{opacity:.95;transform:scale(1.2)}30%{transform:scale(.95)}
  45%{transform:scale(1)}80%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(.9) translateY(-14px)}}
.mute{position:absolute;right:10px;bottom:10px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);
  color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:none}
.mute svg{width:15px;height:15px}
.pa{display:flex;align-items:center;padding:4px 6px 0}
.like.on{color:var(--like)}
.like.bump svg{animation:bump .35s ease}
@keyframes bump{50%{transform:scale(1.25)}}
.pb{padding:0 14px}
.pb p{margin:3px 0}
.likes{font-weight:600}
.link{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;margin:3px 0;display:block;text-align:left}
.link.strong{color:var(--accent);font-weight:600}
.time{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.2px;margin-top:4px!important}
.empty{text-align:center;padding:60px 30px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:6px}

/* Tab-Leiste */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:470px;z-index:30;
  background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
.tabbar .icon-btn{padding:9px 14px}
.tabbar .av{outline:1.5px solid transparent;outline-offset:1.5px}
.tabbar .on .av{outline-color:var(--fg)}

/* Buttons & Felder */
.btn{display:block;width:100%;padding:11px 14px;border-radius:9px;border:0;background:var(--soft);font-weight:600;
  cursor:pointer;text-align:center;font-size:14px}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45}
.btn + .btn{margin-top:8px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--soft);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;resize:none}
input[type=text]:focus,textarea:focus{border-color:var(--muted)}
label.fl{display:block;font-weight:600;margin:14px 0 6px}

/* Onboarding */
.onb{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:30px 26px;text-align:center;gap:10px}
.onb .wordmark{font-size:58px;margin-bottom:6px}
.onb p{margin:0 0 14px}

/* Sheets */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0);transition:background .2s;display:flex;align-items:flex-end;justify-content:center}
.backdrop.open{background:rgba(0,0,0,.45)}
.sheet{background:var(--sheet);width:100%;max-width:470px;border-radius:14px 14px 0 0;max-height:92dvh;overflow:auto;
  padding:6px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease}
.backdrop.open .sheet{transform:none}
.sheet.tall{min-height:72dvh}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sh-title{text-align:center;font-size:16px;margin:0 0 12px}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--sheet);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cprev{position:relative;border-radius:10px;overflow:hidden;background:var(--soft);margin-bottom:10px;
  display:flex;align-items:center;justify-content:center;min-height:160px}
.cprev img,.cprev video{width:100%;max-height:46dvh;object-fit:contain;display:block;background:#000}
.cprev .tp{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;
  font-size:21px;font-weight:600;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere}
.cprev.story .tp{aspect-ratio:9/16;max-height:46dvh}
.cprev .x{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%}
.cprev .x svg{width:18px;height:18px}
.pick{display:flex;gap:8px;margin-bottom:10px}
.pick label{flex:1;margin:0}
.grads{display:flex;gap:10px;margin:10px 0 14px}
.grads button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.grads button.on{border-color:var(--fg)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{font-size:24px;padding:6px 0;border-radius:8px;border:2px solid transparent;background:var(--soft);cursor:pointer}
.emojis button.on{border-color:var(--accent)}
.menu .btn{background:none;border-top:1px solid var(--line);border-radius:0}
.menu .btn:first-of-type{border-top:0}

/* Kommentare */
.clist{display:flex;flex-direction:column;gap:14px;min-height:120px;max-height:52dvh;overflow:auto;padding-bottom:10px}
.citem{display:flex;gap:10px;align-items:flex-start}
.citem p{margin:0}
.citem small{color:var(--muted);font-size:12px}
.cform{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.cform input{flex:1;border-radius:20px;padding:9px 14px}

/* Raster (Profil, Suche, Archiv) */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{position:relative;aspect-ratio:1/1;background:var(--soft);overflow:hidden;border:0;padding:0;cursor:pointer}
.tile.tall{aspect-ratio:9/16}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .tp{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:8px;color:#fff;
  font-size:12px;font-weight:600;text-align:center;overflow:hidden}
.tile .badge{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.tile .badge svg{width:18px;height:18px}
.tile .date{position:absolute;left:6px;top:6px;background:var(--sheet);color:var(--fg);border-radius:6px;
  padding:2px 6px;font-size:11px;font-weight:700;line-height:1.2;text-align:center}
.prof{display:flex;align-items:center;gap:22px;padding:16px 16px 10px}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:17px}
.stats span{font-size:13px}
.pname{padding:0 16px 12px}
.pname b{display:block}
.pact{padding:0 16px 14px;display:flex;gap:8px}
.pact .btn{margin:0;padding:8px}
.ptabs{display:flex;border-top:1px solid var(--line)}
.ptabs button{flex:1;background:none;border:0;padding:11px;color:var(--muted);cursor:pointer;border-top:1px solid transparent;margin-top:-1px}
.ptabs button.on{color:var(--fg);border-top-color:var(--fg)}
.ptabs svg{width:24px;height:24px}
.searchbar{padding:8px 12px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:calc(8px + env(safe-area-inset-top))}
.searchbar input{border-radius:10px;padding:9px 12px}

/* Aktivität */
.act{display:flex;align-items:center;gap:12px;padding:10px 16px}
.act p{margin:0;flex:1}
.act .thumb{width:44px;height:44px;flex:0 0 auto;overflow:hidden;border-radius:4px;background:var(--soft);border:0;padding:0;cursor:pointer}
.act .thumb img,.act .thumb video{width:100%;height:100%;object-fit:cover}
.act .thumb .tp{width:100%;height:100%;font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px}
.act-h{font-weight:700;font-size:16px;padding:14px 16px 4px;margin:0}

/* Story-Ansicht */
.viewer{position:fixed;inset:0;z-index:80;background:#000;display:flex;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.vwrap{position:relative;width:100%;max-width:470px;height:100%;overflow:hidden;color:#fff}
.vbody{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.vbody img,.vbody video{width:100%;height:100%;object-fit:contain}
.vbody .tp{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:40px 30px;
  font-size:27px;font-weight:600;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.3}
.vcap{position:absolute;left:0;right:0;bottom:0;padding:40px 18px calc(26px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(0,0,0,.6));font-size:16px;white-space:pre-wrap;z-index:3;pointer-events:none}
.vtop{position:absolute;left:0;right:0;top:0;z-index:4;padding:calc(8px + env(safe-area-inset-top)) 8px 20px;
  background:linear-gradient(rgba(0,0,0,.45),transparent)}
.vbars{display:flex;gap:3px;padding:0 2px}
.vbars i{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.vbars b{display:block;height:100%;width:0;background:#fff}
.vhead{display:flex;align-items:center;gap:9px;padding:9px 2px 0 4px}
.vhead span{opacity:.8;font-size:13px}
.vhead .tag{background:rgba(255,255,255,.22);padding:1px 7px;border-radius:9px;font-size:11px;opacity:1}
.vhead .icon-btn{color:#fff;margin-left:auto}
.vtap{position:absolute;top:0;bottom:0;z-index:2}
.vtap.l{left:0;width:32%}
.vtap.r{right:0;width:68%}
.vseen{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:4;font-size:13px;opacity:.85}

.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;
  background:#262626;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;
  box-shadow:0 4px 16px rgba(0,0,0,.25);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}

/* ---------- Phase 2 ---------- */
.hbtn{position:relative}
.dot{position:absolute;top:3px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--like);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
.quick{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qb{flex:1 0 auto;min-width:64px;background:var(--soft);border:0;border-radius:14px;padding:8px 6px 6px;cursor:pointer;text-align:center}
.qb span{display:block;font-size:22px;line-height:1.1}
.qb small{display:block;font-size:11px;font-weight:600;margin-top:3px;white-space:nowrap}
.qb.sos{background:#fde8ea;color:#c4142c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qb.sos{background:#3a1015;color:#ff8a98}}
:root[data-theme="dark"] .qb.sos{background:#3a1015;color:#ff8a98}
.chal{margin:10px 12px;border-radius:14px;padding:14px;color:#fff;background:linear-gradient(135deg,#7b61ff,#e8457c);cursor:pointer;border:0;width:calc(100% - 24px);text-align:left;display:block}
.chal small{opacity:.85;font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.chal b{display:block;font-size:19px;margin:4px 0 8px;line-height:1.25}
.chal .row{display:flex;align-items:center;gap:8px;font-size:13px}
.chal .go{margin-left:auto;background:#fff;color:#7b61ff;border-radius:20px;padding:5px 12px;font-weight:700;font-size:13px}
.tag-ch{display:inline-block;background:var(--soft);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:600;margin:4px 0 2px}
.syncline{font-size:11px;color:var(--muted);text-align:center;padding:6px}

/* Chat */
.chat{display:flex;flex-direction:column;min-height:100dvh}
.chat .topbar{gap:10px;justify-content:flex-start}
.clog{flex:1;padding:12px 12px 90px;display:flex;flex-direction:column;gap:3px}
.daysep{text-align:center;font-size:12px;color:var(--muted);margin:14px 0 8px}
.bub{max-width:76%;padding:8px 12px;border-radius:20px;font-size:15px;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,#7b61ff,#e8457c);color:#fff}
.bub.them{align-self:flex-start;background:var(--soft)}
.bub time{display:block;font-size:10.5px;opacity:.7;margin-top:2px;text-align:right}
.rd{align-self:flex-end;font-size:11px;color:var(--muted);margin:1px 6px 6px}
.cbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:470px;background:var(--bg);
  border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:30}
.cbar input{flex:1;border-radius:22px;padding:10px 14px}
.cbar .icon-btn{flex:0 0 auto}

/* Sound-Katalog */
.sounds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sounds button{background:var(--soft);border:2px solid transparent;border-radius:12px;padding:10px 2px 8px;cursor:pointer}
.sounds button span{display:block;font-size:27px;line-height:1.1}
.sounds button small{display:block;font-size:11px;margin-top:3px;font-weight:600}
.sounds button.on{border-color:var(--accent)}

/* Ping-Hinweis */
.alert{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;animation:tin .2s}
.alert .card{background:var(--sheet);border-radius:20px;padding:24px 20px 18px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.alert .card .big{font-size:58px;line-height:1}
.alert .card h2{margin:10px 0 6px;font-size:20px}
.alert .card p{margin:0 0 16px;color:var(--muted)}
.alert.sos .card{background:#c4142c;color:#fff}
.alert.sos .card p{color:#ffe1e5}
.alert.sos .btn{background:#fff;color:#c4142c}
.alert.sos .btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.alert .maplink{display:block;margin-bottom:10px}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}

/* Onboarding Schritte */
.step{min-height:100dvh;display:flex;flex-direction:column;padding:calc(30px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.step .ico{font-size:54px;margin:20px 0 10px}
.step h2{font-size:24px;margin:0 0 10px;line-height:1.2}
.step p{margin:0 0 12px;color:var(--muted);font-size:15px}
.step .grow{flex:1}
.step ol{padding-left:20px;margin:0 0 12px;font-size:15px}
.step ol li{margin-bottom:6px}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 16px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.ok{color:#1a9b4b;font-weight:700}
.linkbox{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;word-break:break-all;margin:6px 0 12px;user-select:all}
.rlist .rl{display:flex;align-items:center;gap:12px;padding:10px 16px;background:none;border:0;width:100%;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
.rl .rt{width:54px;height:54px;border-radius:12px;overflow:hidden;flex:0 0 auto;background:var(--soft)}
.rl .rt img,.rl .rt video{width:100%;height:100%;object-fit:cover}
.rl .rt .tp{width:100%;height:100%;font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center;padding:3px;overflow:hidden}
.rl b{display:block}
.rl small{color:var(--muted)}
.vtitle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 26px}
.vtitle small{font-size:14px;letter-spacing:.5px;text-transform:uppercase;opacity:.85}

  if (d < 172800) return 'gestern';
  if (d < 7*86400) return `vor ${Math.floor(d/86400)} Tagen`;
  const dt = new Date(t), o = {day:'numeric', month:'long'};
  if (dt.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return dt.toLocaleDateString('de-DE', o);
}
function dayLabel(t){
  const d = new Date(t); d.setHours(0,0,0,0);
  const n = new Date(); n.setHours(0,0,0,0);
  const diff = Math.round((n - d) / DAY);
  if (diff === 0) return 'Heute';
  if (diff === 1) return 'Gestern';
  return new Date(t).toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long'});
}
function shortDate(t){ const d = new Date(t); return `${d.getDate()}<br>${d.toLocaleDateString('de-DE',{month:'short'}).replace('.','')}`; }
function weekStart(t){ const d = new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }
function addDays(t, n){ const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); }
function challengeFor(t){
  const ws = weekStart(t);
  const n = Math.round((ws - weekStart(CH_START)) / (7*DAY));
  const idx = ((n % CHALLENGES.length) + CHALLENGES.length) % CHALLENGES.length;
  return { idx, week:ws, text:CHALLENGES[idx], id:'w' + dmy(ws) + new Date(ws).getFullYear() };
}

const Sound = {

  unlock(){

      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); }
      if (this.ctx.state === 'suspended') this.ctx.resume();

function osc(c, t, o){
  const { type='sine', f0, f1=f0, dur, vol=.3, attack=.02, release=.08, filter, vib=0, vibRate=6, lin=false } = o;
  const s = c.createOscillator(); s.type = type; s.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) lin ? s.frequency.linearRampToValueAtTime(f1, t + dur) : s.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.setValueAtTime(vol, t + Math.max(attack, dur - release)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let node = s;
  if (filter) { const bf = c.createBiquadFilter(); bf.type = filter.type || 'lowpass'; bf.frequency.value = filter.f; bf.Q.value = filter.q || 1; s.connect(bf); node = bf; }
  if (vib) { const l = c.createOscillator(); l.frequency.value = vibRate; const lg = c.createGain(); lg.gain.value = vib; l.connect(lg); lg.connect(s.frequency); l.start(t); l.stop(t + dur); }
  node.connect(g); g.connect(c.destination); s.start(t); s.stop(t + dur + .05);
}
function noise(c, t, { dur, vol=.3, filter={type:'bandpass', f:1000, q:1} }){
  const n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource(); src.buffer = b;
  const bf = c.createBiquadFilter(); bf.type = filter.type; bf.frequency.value = filter.f; bf.Q.value = filter.q || 1;
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bf); bf.connect(g); g.connect(c.destination); src.start(t); src.stop(t + dur);
}

/* ---------- Lokaler Speicher (IndexedDB) ---------- */
const TABLES = {
  profiles:{ key:r => r.role },
  posts:{ key:r => r.id },
  reactions:{ key:r => r.post_id + '|' + r.role },
  comments:{ key:r => r.id },
  stories:{ key:r => r.id },
  story_views:{ key:r => r.story_id + '|' + r.role },
  messages:{ key:r => r.id },
  pings:{ key:r => r.id }
};
const DB = (() => {
  let dbp;
  const STORES = [...Object.keys(TABLES), 'media', 'meta', 'outbox'];
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('anke-joerg-v2', 1);
      r.onupgradeneeded = () => STORES.forEach(s => { if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s); });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const st = async (n, m='readonly') => (await open()).transaction(n, m).objectStore(n);
  return {
    get: async (n, k) => req((await st(n)).get(k)),
    put: async (n, v, k) => req((await st(n, 'readwrite')).put(v, k)),
    del: async (n, k) => req((await st(n, 'readwrite')).delete(k)),
    all: async n => req((await st(n)).getAll()),
    entries: async n => { const s = await st(n); const [ks, vs] = await Promise.all([req(s.getAllKeys()), req(s.getAll())]); return ks.map((k, i) => [k, vs[i]]); },
    putMany: async (n, items) => { const d = await open(); return new Promise((res, rej) => { const tx = d.transaction(n, 'readwrite'); const s = tx.objectStore(n); items.forEach(([k, v]) => s.put(v, k)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
  };
})();
const meta = { get: k => DB.get('meta', k), set: (k, v) => DB.put('meta', v, k) };

/* ---------- Abgleich mit Supabase ---------- */
const Sync = {
  sb:null, ready:false, channel:null, status:'lokal',
  get configured(){ return !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase); },
  client(){
    if (!this.sb && this.configured) this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, storageKey:'aj-auth' } });
    return this.sb;
  },
  async ensureAuth(){
    const sb = this.client();
    let { data:{ session } } = await sb.auth.getSession();
    let fresh = false;
    if (!session) { const r = await sb.auth.signInAnonymously(); if (r.error) throw r.error; session = r.data.session; fresh = true; }
    return { session, fresh };
  },
  async start(){
    if (!this.configured || !S.spaceId || S.spaceId === 'local') { this.status = 'lokal'; return; }
    try {
      const { fresh } = await this.ensureAuth();
      if (fresh && S.secret) { const r = await this.sb.rpc('join_space', { p_secret:S.secret, p_role:S.me }); if (r.error) throw r.error; }
      try { const ms = await this.sb.rpc('my_space'); if (!ms.error && ms.data && ms.data.space_id && ms.data.space_id !== S.spaceId) await switchSpace(ms.data); } catch (_) {}
      this.ready = true; this.status = 'verbunden';
      this.subscribe(); await this.pull(); Outbox.flush();
    } catch (e) { this.status = 'offline'; console.warn('Sync', e); setTimeout(() => this.start(), 20000); }
  },
  subscribe(){
    if (this.channel) this.sb.removeChannel(this.channel);
    const ch = this.sb.channel('sp-' + S.spaceId);
    Object.keys(TABLES).forEach(t => ch.on('postgres_changes', { event:'*', schema:'public', table:t, filter:'space_id=eq.' + S.spaceId }, p => { if (p.new && Object.keys(p.new).length) onRemote(t, p.new, true); }));
    ch.subscribe(st => { if (st === 'SUBSCRIBED') { this.status = 'verbunden'; } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') { this.status = 'offline'; } });
    this.channel = ch;
  },
  async pull(){
    if (!this.ready) return;
    const res = await Promise.all(Object.keys(TABLES).map(t => {
      let q = this.sb.from(t).select('*').eq('space_id', S.spaceId);
      if (t === 'pings') q = q.gte('created_at', Date.now() - 30*DAY);
      return q.then(r => [t, r]);
    }));
    const pend = await Outbox.pendingKeys();
    for (const [t, { data, error }] of res) {
      if (error) { console.warn(t, error); Outbox.lastError = t + ': ' + error.message; continue; }
      const items = [];
      data.forEach(row => { const k = TABLES[t].key(row); if (pend.has(t + '|' + k)) return; const prev = D[t].get(k); D[t].set(k, row); items.push([k, row]); effects(t, row, prev, false); });
      if (items.length) await DB.putMany(t, items);
    }
    scheduleRender();
  },
  async push(kind, title, body, urgent){
    if (!this.ready) return;
    try { await this.sb.functions.invoke('send-push', { body:{ space_id:S.spaceId, kind, title, body, urgent:!!urgent, tag:kind } }); } catch (_) {}
  }
};
const Outbox = {
  busy:false, timer:null, lastError:'',
  async add(job){ const oid = newId(); job.tries = 0; await DB.put('outbox', job, oid); this.flush(); },
  async count(){ return (await DB.entries('outbox')).length; },
  async pendingKeys(){ const set = new Set(); (await DB.entries('outbox')).forEach(([, j]) => { if (j.table && j.row) set.add(j.table + '|' + TABLES[j.table].key(j.row)); }); return set; },
  async flush(){
    if (this.busy) { this.again = true; return; }
    if (!Sync.ready || !navigator.onLine) return;
    this.busy = true; this.again = false; let failed = false;
    const failedUploads = new Set();
    try {
      const jobs = (await DB.entries('outbox')).sort((a,b) => a[0] < b[0] ? -1 : 1);
      for (const [oid, job] of jobs) {
        let err = null;
        try {
          if (job.type === 'upload') {
            const m = await DB.get('media', job.path);
            if (m) { const r = await Sync.sb.storage.from('media').upload(job.path, m.blob, { contentType:m.blob.type || 'image/jpeg', upsert:true }); err = r.error; }
          } else if (job.type === 'remove') {
            await Sync.sb.storage.from('media').remove([job.path]);
          } else {
            const row = { ...job.row }; if (row.space_id !== S.spaceId && S.spaceId) row.space_id = S.spaceId;
            const mp = row.media_path || row.avatar_path;
            if (mp && failedUploads.has(mp)) err = { message:'Bild noch nicht hochgeladen' };
            else { const r = await Sync.sb.from(job.table).upsert(row); err = r.error; }
          }
        } catch (e) { err = e; }
        if (err) {
          failed = true; this.lastError = (job.table || job.type) + ': ' + (err.message || err.error || String(err));
          console.warn('Outbox', this.lastError);
          if (job.type === 'upload') failedUploads.add(job.path);
          job.tries = (job.tries || 0) + 1;
          if (job.tries >= 8 && !/fetch|network|Failed|timeout/i.test(this.lastError)) { await DB.del('outbox', oid); meta.set('lastDropped', { at:Date.now(), err:this.lastError }); }
          else await DB.put('outbox', job, oid);
          continue;
        }
        await DB.del('outbox', oid);
      }
    } catch (e) { console.warn('Outbox', e); failed = true; this.lastError = String(e.message || e); }
    if (!failed) this.lastError = '';
    this.busy = false;
    if (this.again) { this.again = false; setTimeout(() => this.flush(), 400); return; }
    if ((await this.count()) > 0) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), failed ? 15000 : 1000); }
  }
};
window.addEventListener('online', () => { Outbox.flush(); if (Sync.ready) Sync.pull(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Sync.ready) { Sync.pull(); Outbox.flush(); } });

/* ---------- Medien ---------- */
const urlCache = new Map();
async function mediaURL(path){
  if (!path) return '';
  if (urlCache.has(path)) return urlCache.get(path);
  let m = await DB.get('media', path);
  if (!m && Sync.ready) {
    const { data, error } = await Sync.sb.storage.from('media').download(path);
    if (!error && data) { m = { blob:data, type:(data.type || '').startsWith('video') ? 'video' : 'image' }; await DB.put('media', m, path); }
  }
  if (!m) return '';
  const u = URL.createObjectURL(m.blob); urlCache.set(path, u); return u;
}
function hydrate(root){
  $$('[data-media]', root).forEach(el => mediaURL(el.dataset.media).then(u => { if (u && el.getAttribute('src') !== u) el.src = u; }));
}
function loadImg(file){
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Bild konnte nicht gelesen werden.')); i.src = URL.createObjectURL(file); });
}
async function processFile(file, max=1600){
  if ((file.type || '').startsWith('video/')) {
    if (file.size > 50e6) throw new Error('Das Video ist zu groß (max. 50 MB). Kürzer aufnehmen hilft.');
    const m = await new Promise(res => {
      const v = document.createElement('video'); v.preload = 'metadata'; v.muted = true;
      v.onloadedmetadata = () => res({ w:v.videoWidth, h:v.videoHeight, d:v.duration }); v.onerror = () => res({ w:9, h:16, d:0 });
      v.src = URL.createObjectURL(file);
    });
    return { blob:file, type:'video', w:m.w || 9, h:m.h || 16, d:m.d || 0, ext:(file.type.includes('quicktime') ? 'mov' : 'mp4') };
  }
  let src = null;
  if (window.createImageBitmap) { try { src = await createImageBitmap(file); } catch (_) { src = null; } }
  if (!src) src = await loadImg(file);
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight, k = Math.min(1, max / Math.max(w, h));
  const cw = Math.round(w * k), ch = Math.round(h * k);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  c.getContext('2d').drawImage(src, 0, 0, cw, ch);
  if (src.close) src.close(); else if (src.src) URL.revokeObjectURL(src.src);
  // Schutz: manche Browser (z. B. Samsung Internet) liefern hier ein schwarzes Bild
  let blank = false;
  try {
    const t = document.createElement('canvas'); t.width = 32; t.height = 32; const tc = t.getContext('2d');
    tc.drawImage(c, 0, 0, 32, 32); const d = tc.getImageData(0, 0, 32, 32).data; let mx = 0;
    for (let i = 0; i < d.length; i += 4) mx = Math.max(mx, d[i] + d[i + 1] + d[i + 2]);
    blank = mx < 15;
  } catch (_) {}
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  const suspicious = !blob || (blob.size < 20000 && file.size > 100000 && blob.size < file.size * 0.05);
  if (blank || suspicious) {
    const t = (file.type || 'image/jpeg').toLowerCase();
    const ext = t.includes('png') ? 'png' : t.includes('webp') ? 'webp' : t.includes('heic') || t.includes('heif') ? 'heic' : 'jpg';
    if (file.size > 25e6) throw new Error('Das Foto ist zu groß zum Hochladen.');
    return { blob:file, type:'image', w, h, ext };
  }
  return { blob, type:'image', w:cw, h:ch, ext:'jpg' };
}
async function storeMedia(pr){
  const path = `${S.spaceId}/${newId()}.${pr.ext}`;
  await DB.put('media', { blob:pr.blob, type:pr.type }, path);
  if (Sync.configured && S.spaceId !== 'local') await Outbox.add({ type:'upload', path });
  return path;
}
async function saveToPhone(path){
  const m = await DB.get('media', path); if (!m) { toast('Datei ist noch nicht geladen'); return; }
  const ext = path.split('.').pop();
  const file = new File([m.blob], `anke-joerg-${Date.now()}.${ext}`, { type:m.blob.type || (ext === 'jpg' ? 'image/jpeg' : 'video/mp4') });
  try { if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file] }); return; } }
  catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); toast('Gespeichert im Download-Ordner');
}

async function initMap(){
  const el = $('#map'); if (!el) return;
  try { await loadLeaflet(); } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (!$('#map')) return;
  if (LMap) { LMap.remove(); LMap = null; }
  LMap = L.map('map', { zoomControl:false, attributionControl:true }).setView([51.2, 10.4], 5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18, attribution:'© OpenStreetMap' }).addTo(LMap);
  const pts = [];
  ['je', 'anke'].forEach(r => {

    const icon = L.divIcon({ html, className:'mpin-wrap', iconSize:[46, 46], iconAnchor:[23, 23] });
    L.marker([g.lat, g.lng], { icon }).addTo(LMap).bindPopup(`<b>${esc(nick(r))}</b><br>${ago(g.created_at)}`);
    L.circle([g.lat, g.lng], { radius:Math.max(100, g.acc || 100), color:'#e8457c', weight:1, fillOpacity:.08 }).addTo(LMap);
    pts.push([g.lat, g.lng]);

}

      <input type="text" id="cmsg" placeholder="Nachricht …" autocomplete="off" enterkeyhint="send" maxlength="2000">
      <button class="link strong" type="submit">Senden</button></form></div>`;
    hydrate(app);
  }
  const ms = messages(); const log = $('#clog');
  let h = '', lastDay = '';
  ms.forEach(m => {
    const dl = dayLabel(m.created_at);
    if (dl !== lastDay) { h += `<div class="daysep">${esc(dl)}</div>`; lastDay = dl; }
    const pm = /^\[\[post:([\w-]+)\]\]$/.exec(m.text || ''), sp = pm && D.posts.get(pm[1]);
    if (pm) h += `<button class="bub pcard ${m.author === S.me ? 'me' : 'them'}" data-act="open-post" data-id="${pm[1]}">${sp && !sp.deleted ? `<div class="pc-th">${thumb(sp)}</div><b>${esc(nick(sp.author))}</b><span>${esc((sp.text || '').slice(0, 60))}</span>` : '<span>Beitrag nicht mehr da</span>'}<time>${hhmm(m.created_at)}</time></button>`;
    else h += `<div class="bub ${m.author === S.me ? 'me' : 'them'}">${esc(m.text)}<time>${hhmm(m.created_at)}</time></div>`;
  });
  const lastMine = [...ms].reverse().find(m => m.author === S.me);
  if (lastMine && ms[ms.length - 1] === lastMine) h += `<div class="rd">${lastMine.read_at ? 'Gelesen ' + hhmm(lastMine.read_at) : 'Gesendet'}</div>`;
  if (!ms.length) h = `<div class="empty">Schreib ${esc(nick(other()))} die erste Nachricht 💬</div>`;
  const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
  log.innerHTML = h; hydrate(log);
  if (!ms.length) window.scrollTo(0, 0);
  else if (atBottom || !log.dataset.init) { window.scrollTo(0, document.body.scrollHeight); log.dataset.init = '1'; }
  markRead();
}
async function markRead(){
  if (document.visibilityState !== 'visible' || S.tab !== 'chat') return;
  const now = Date.now();
  for (const m of messages().filter(m => m.author !== S.me && !m.read_at)) await put('messages', { ...m, read_at:now });
}

  Sync.push('message', nick(S.me), text.slice(0, 140));
}

function getPos(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({ lat:+p.coords.latitude.toFixed(3), lng:+p.coords.longitude.toFixed(3), acc:Math.round(p.coords.accuracy) }),
      () => res(null), { enableHighAccuracy:false, timeout:12000, maximumAge:120000 });
  });
}
const PUSH_TXT = {
  good:   n => [`${n} hat gute Laune 😊`, 'Feier mit!'],
  sad:    n => [`${n} ist traurig 🥺`, 'Nicht fragen – einfach da sein. ❤️'],
  sos:    n => [`🆘 ${n}: Komm vorbei!`, 'Bitte melde dich – Standort in der App.'],
  findme: n => [`📍 ${n} teilt den Standort`, 'Ungefähre Position in der App ansehen.'],
  hug:    n => [`❤️ ${n} ist für dich da`, ''],
  coming: n => [`🚗 ${n} ist auf dem Weg!`, ''],
  cheer:  n => [`🎉 ${n} feiert mit!`, '']
};
async function sendPing(kind, extra={}){
  let pos = null;
  if (kind === 'sos' || kind === 'findme') { toast('Standort wird ermittelt …'); pos = await getPos(); if (!pos) toast('Ohne Standort gesendet (nicht erlaubt oder nicht gefunden)'); }
  const row = { id:newId(), from_role:S.me, kind, sound:extra.sound || null, lat:pos ? pos.lat : null, lng:pos ? pos.lng : null, acc:pos ? pos.acc : null, created_at:Date.now() };
  await put('pings', row);
  const n = nick(S.me);
  if (kind === 'sound') { const si = soundInfo(extra.sound); Sync.push('sound', `${si[1]} ${n} schickt dir: ${si[2]}`, 'Tippen zum Öffnen'); }
  else { const t = (PUSH_TXT[kind] || (x => [x, '']))(n); Sync.push(kind, t[0], t[1], kind === 'sos'); }
  const conf = { good:'Gute Laune verschickt 😊', sad:`${nick(other())} weiß Bescheid ❤️`, sos:'Notruf ist raus 🆘', findme:'Standort geteilt 📍', sound:'Sound verschickt 🔔', hug:'❤️ angekommen', coming:'Bescheid gegeben 🚗', cheer:'🎉 verschickt' };
  toast(conf[kind] || 'Gesendet');
  if (!Sync.ready) setTimeout(() => toast(Sync.configured ? 'Kommt an, sobald wieder Netz da ist' : 'Hinweis: Ohne Supabase nur auf diesem Gerät'), 2900);
}
let alarmLoop;
function showPingAlert(g){

  const map = g.lat ? `<a class="btn maplink" href="${mapURL(g)}" target="_blank" rel="noopener">📍 Auf der Karte ansehen (ca. ${g.acc ? Math.max(100, g.acc) : 100} m)</a>` : '';

    case 'good': big = '😊'; title = `${n} hat gute Laune!`; txt = 'Feier mit!'; btns = `<button class="btn primary" data-act="reply" data-k="cheer">🎉 Mitfeiern</button>`; Sound.play(fav); break;
    case 'sad': big = '🥺'; title = `${n} ist traurig`; txt = 'Jetzt nicht fragen. Einfach da sein.'; btns = `<button class="btn primary" data-act="reply" data-k="hug">❤️ Ich bin da</button><button class="btn" data-act="reply-chat">Nachricht schreiben</button>`; Sound.play('herz'); break;
    case 'sos': cls = 'sos'; big = '🆘'; title = `${n}: Komm vorbei!`; txt = g.lat ? 'Ungefährer Standort:' : 'Kein Standort mitgeschickt.'; btns = `<button class="btn" data-act="reply" data-k="coming">🚗 Ich komme!</button><button class="btn ghost" data-act="reply-chat">Nachricht schreiben</button>`;
      Sound.play('alarm'); let k = 0; alarmLoop = setInterval(() => { if (++k > 3) clearInterval(alarmLoop); else Sound.play('alarm'); }, 2700); break;
    case 'findme': big = '📍'; title = `Hier ist ${n} ungefähr`; txt = g.lat ? '' : 'Der Standort konnte nicht ermittelt werden.'; btns = ''; Sound.play(fav); break;
    case 'sound': { const si = soundInfo(g.sound); big = si[1]; title = `${n} schickt dir: ${si[2]}`; txt = ''; btns = `<button class="btn" data-act="replay" data-s="${si[0]}">Nochmal abspielen</button>`; Sound.play(si[0]); break; }

    case 'cheer': big = '🎉'; title = `${n} feiert mit!`; txt = ''; btns = ''; Sound.play('fanfare'); break;

  }
  const el = document.createElement('div'); el.className = 'alert ' + cls;

let viewObs; const viewT = {};
function watchViews(){
  if (viewObs) viewObs.disconnect();
  if (!('IntersectionObserver' in window)) return;
  viewObs = new IntersectionObserver(es => es.forEach(e => {
    const id = e.target.id.replace(/^[pr]-/, '');
    if (e.isIntersecting && e.intersectionRatio > 0.6) { if (!viewT[id]) viewT[id] = setTimeout(() => markView(id), 1200); }
    else { clearTimeout(viewT[id]); viewT[id] = 0; }
  }), { threshold:[0, .6, 1] });
  $$('.feed .post, .reel').forEach(el => viewObs.observe(el));
}
async function markView(id){
  const p = D.posts.get(id); if (!p || p.author === S.me) return;
  const k = id + '|' + S.me + ':view'; if (D.reactions.get(k)) return;
  await put('reactions', { post_id:id, role:S.me + ':view', at:Date.now(), on:true });
}
async function toggleFav(id){
  const p = D.posts.get(id); if (!p) return;

  await put('reactions', { post_id:id, role:k, at:Date.now(), on:!on });

  refreshPost(p);
}

const V = { list:[], i:0, raf:0, last:0, elapsed:0, dur:5000, paused:false, downAt:0, ready:true };
function openViewer(items, i){
  if (!items.length) return;
  V.list = items; V.i = Math.max(0, Math.min(i || 0, items.length - 1));
  const el = document.createElement('div'); el.className = 'viewer'; el.id = 'viewer'; el.innerHTML = '<div class="vwrap"></div>';
  document.body.appendChild(el); document.body.style.overflow = 'hidden';
  el.addEventListener('focusin', e => { if (e.target.id === 'vrin') { V.paused = true; V.typing = true; const v = $('#viewer video'); if (v) v.pause(); } });
  el.addEventListener('focusout', e => { if (e.target.id === 'vrin') { V.typing = false; V.paused = false; } });
  el.addEventListener('pointerdown', e => { if (e.target.closest('[data-act="viewer-close"],[data-act="viewer-profile"],.vreply')) return; V.downAt = Date.now(); V.paused = true; const v = $('#viewer video'); if (v) v.pause(); });
  const resume = () => { if (!$('#viewer') || V.typing) return; V.paused = false; const v = $('#viewer video'); if (v && V.ready) v.play().catch(() => {}); };
  el.addEventListener('pointerup', resume); el.addEventListener('pointercancel', resume); el.addEventListener('pointerleave', resume);
  showItem();
}

    }

  }

  if (it.type === 'title' && it.id) { S.recapSeen.add(it.id); meta.set('recapSeen', [...S.recapSeen]); }
  V.elapsed = 0; V.last = 0; V.dur = it.type === 'title' ? 3500 : 5000; V.ready = true;
  const v = $('video', wrap);
  if (v) {
    V.ready = false;
    const go = () => { V.dur = Math.min(30, v.duration || 5) * 1000; V.ready = true; if (!V.paused) v.play().catch(() => { v.muted = true; v.play().catch(() => {}); }); };
    if (v.readyState >= 1) go(); else v.addEventListener('loadedmetadata', go, { once:true });
    setTimeout(() => { if (!V.ready) { V.ready = true; } }, 6000);
  }

}
function loop(now){
  if (!$('#viewer')) return;
  if (!V.last) V.last = now;
  if (!V.paused && V.ready) V.elapsed += now - V.last;
  V.last = now;
  const bar = $(`#viewer .vbars i:nth-child(${V.i + 1}) b`); if (bar) bar.style.width = Math.min(100, V.elapsed / V.dur * 100) + '%';
  if (V.elapsed >= V.dur) { nextItem(); return; }
  V.raf = requestAnimationFrame(loop);
}
function nextItem(){ if (V.i < V.list.length - 1) { V.i++; showItem(); } else closeViewer(); }
function prevItem(){ if (V.i > 0) V.i--; showItem(); }

async function enablePush(){
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window))
    throw new Error(isIOS() && !standalone() ? 'Auf dem iPhone geht das erst, wenn die App auf dem Home-Bildschirm liegt.' : 'Dieses Gerät oder dieser Browser kann keine Push-Nachrichten.');
  if (!Sync.ready) throw new Error('Erst mit dem Server verbinden (Internet?).');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('Benachrichtigungen wurden nicht erlaubt. In den Handy-Einstellungen änderbar.');
  const reg = await navigator.serviceWorker.ready;
  const { data, error } = await Sync.sb.functions.invoke('send-push', { body:{ action:'key' } });
  if (error || !data || !data.publicKey) throw new Error('Push-Dienst nicht erreichbar.');
  const key = Uint8Array.from(atob((data.publicKey + '='.repeat((4 - data.publicKey.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  let sub = await reg.pushManager.getSubscription();
  if (sub) { try { await sub.unsubscribe(); } catch (_) {} }
  sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:key });
  const r = await Sync.sb.from('push_subs').upsert({ endpoint:sub.endpoint, space_id:S.spaceId, role:S.me, sub:sub.toJSON() });
  if (r.error) throw r.error;
  return true;
}

let vObs;
function watchVideos(){
  if (vObs) vObs.disconnect();
  if (!('IntersectionObserver' in window)) return;
  vObs = new IntersectionObserver(es => es.forEach(e => { const v = e.target; if (e.isIntersecting && e.intersectionRatio > 0.6) v.play().catch(() => {}); else v.pause(); }), { threshold:[0, .6, 1] });
  $$('.feed video').forEach(v => vObs.observe(v));
}

  const hasStory = storiesOf(r, true).length > 0;
  el.innerHTML = `<div class="avbig-c">${p.avatar_path ? `<img data-media="${esc(p.avatar_path)}" alt="">` : `<span>${esc(p.emoji || '🙂')}</span>`}</div><b>${esc(nick(r))}</b>${hasStory ? `<button class="btn primary" style="width:auto;padding:10px 22px" data-act="avbig-story" data-u="${r}">Story ansehen</button>` : ''}`;
  el.addEventListener('click', e => { if (!e.target.closest('[data-act=avbig-story]')) el.remove(); });
  document.body.appendChild(el); hydrate(el);
}
let holdT = 0, held = false;
document.addEventListener('pointerdown', e => { const h = e.target.closest('[data-hold-avatar]'); held = false; if (!h) return; holdT = setTimeout(() => { held = true; showAvatarBig(h.dataset.holdAvatar); }, 450); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, () => clearTimeout(holdT)));
document.addEventListener('click', e => { if (held && e.target.closest('[data-hold-avatar]')) { e.stopPropagation(); e.preventDefault(); held = false; } }, true);

/* ---------- Nach unten ziehen = aktualisieren ---------- */
const PTR = { y0:null, dist:0, busy:false, el:null };
function ptrEl(){
  if (!PTR.el) { PTR.el = document.createElement('div'); PTR.el.className = 'ptr'; PTR.el.innerHTML = '<div class="ptr-spin"></div>'; document.body.appendChild(PTR.el); }
  return PTR.el;
}
function ptrAllowed(){
  return S.me && !S.onb && !PTR.busy && !$('.backdrop') && !$('#viewer') && !$('.alert') && !['reels', 'map'].includes(S.tab) && window.scrollY <= 0;
}
document.addEventListener('touchstart', e => { PTR.y0 = ptrAllowed() && e.touches.length === 1 ? e.touches[0].clientY : null; PTR.dist = 0; }, { passive:true });
document.addEventListener('touchmove', e => {
  if (PTR.y0 == null) return;
  const d = e.touches[0].clientY - PTR.y0;
  if (d <= 0 || window.scrollY > 0) { PTR.dist = 0; ptrEl().style.transform = 'translate(-50%,-60px)'; return; }
  PTR.dist = Math.min(110, d * 0.5);
  const el = ptrEl(); el.style.transition = 'none'; el.style.transform = `translate(-50%,${PTR.dist - 50}px) rotate(${PTR.dist * 4}deg)`;
  el.classList.toggle('ready', PTR.dist > 65);
}, { passive:true });
document.addEventListener('touchend', () => {
  if (PTR.y0 == null) return; PTR.y0 = null;
  const el = ptrEl(); el.style.transition = '';
  if (PTR.dist > 65) refreshAll(); else el.style.transform = 'translate(-50%,-60px)';
  PTR.dist = 0;
});
async function refreshAll(){
  if (PTR.busy) return; PTR.busy = true;
  const el = ptrEl(); el.classList.add('spinning'); el.style.transform = 'translate(-50%,16px)';
  try {
    // 1) neue App-Version? → neu laden
    try {
      const html = await fetch('./index.html?ts=' + Date.now(), { cache:'no-store' }).then(r => r.text());
      const v = (html.match(/APP_VERSION = '([^']+)'/) || [])[1];
      if (v && v !== APP_VERSION) {
        toast('Neue Version ' + v + ' – wird geladen …');
        const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
        if (reg) { try { await reg.update(); } catch (_) {} }
        if ('caches' in window) { try { for (const k of await caches.keys()) await caches.delete(k); } catch (_) {} }
        setTimeout(() => location.reload(), 600); return;
      }
    } catch (_) {}
    // 2) Daten neu holen
    if (Sync.ready) { await Sync.pull(); Outbox.flush(); } else await Sync.start();
    render(); toast('Aktualisiert ✓');
  } finally {
    setTimeout(() => { el.classList.remove('spinning', 'ready'); el.style.transform = 'translate(-50%,-60px)'; PTR.busy = false; }, 350);
  }
}

/* ---------- Start ---------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.onb && S.onb.step === 'home') render(); });
window.addEventListener('appinstalled', () => { S.installed = true; S.installEvt = null; if (S.onb && S.onb.step === 'home') render(); });
async function boot(){
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    const hadCtrl = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl && !reloaded) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('./sw.js', { updateViaCache:'none' }).then(r => r.update()).catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); });
  }
  for (const t of Object.keys(TABLES)) (await DB.entries(t)).forEach(([k, v]) => D[t].set(k, v));
  S.handled = new Set((await meta.get('handled')) || []);
  S.recapSeen = new Set((await meta.get('recapSeen')) || []);
  S.feedMode = (await meta.get('feedMode')) || 'all';
  S.actSeen = (await meta.get('actSeen')) || 0;
  const dev = await meta.get('device');
  const hs = location.hash + ' ' + location.search;
  const m = hs.match(/join=([a-f0-9]{16,})/i), rh = hs.match(RESTORE_RX);
  if (dev && dev.user) {
    S.me = dev.user; S.spaceId = dev.spaceId || 'local'; S.secret = dev.secret || null;
    if (m && m[1] !== S.secret) toast('Dieses Handy ist schon verbunden.');
    if (location.hash || location.search) history.replaceState(null, '', location.pathname);
    render(); Sync.start().then(scheduleRender);
  } else {
    S.onb = rh ? { step:'welcome', mode:'restore', secret:rh[1], role:rh[2].toLowerCase() } : { step:'welcome', mode:m ? 'join' : 'new', secret:m ? m[1] : null, role:null };
    render();
  }
}
boot().catch(err => { $('#app').innerHTML = `<div class="empty"><b>Speicher nicht verfügbar</b>${esc(err.message || err)}<br>Im privaten Modus funktioniert die App nicht.</div>`; });

</script>
